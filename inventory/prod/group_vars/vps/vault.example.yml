---
# Ansible Vault 加密变量示例
# 复制此文件为 vault.yml 并加密:
#   cp vault.example.yml vault.yml
#   ansible-vault encrypt vault.yml
#
# 运行时通过 .vault-password 文件或 ANSIBLE_VAULT_PASSWORD_FILE 环境变量解密

# VPS 主机 IP (加密)
vault_vps_host_ip: "YOUR_VPS_IP"

# 域名 (加密)
vault_domain_name: "your-domain.com"

# SSH 端口 (加密)
vault_ssh_port: "YOUR_SSH_PORT"

# 系统用户名 (加密)
vault_ansible_user: "YOUR_USER"

# VPS sudo 密码
vault_ansible_become_password: "CHANGEME"

# Cloudflare DNS API Token (用于 Traefik ACME DNS-01 Challenge)
# 权限: Zone:DNS:Edit
vault_traefik_cloudflare_dns_api_token: "CHANGEME"

# Vaultwarden Admin Token (Argon2 PHC hash 格式)
# 1. 先生成随机 token: openssl rand -base64 48
# 2. 然后在 Vaultwarden 容器中生成 Argon2 hash:
#    docker exec -it vaultwarden /vaultwarden hash
# 3. 输入你的 token，复制输出的 $argon2id$... 字符串
# 详见: https://github.com/dani-garcia/vaultwarden/wiki/Enabling-admin-page#using-argon2
vault_vaultwarden_admin_token: "CHANGEME"

# Sub2API secrets (生成: openssl rand -hex 32)
vault_sub2api_postgres_password: "CHANGEME"
vault_sub2api_redis_password: "CHANGEME"
vault_sub2api_jwt_secret: "CHANGEME"
vault_sub2api_totp_encryption_key: "CHANGEME"
# 管理员账号 (仅首次初始化时生效)
vault_sub2api_admin_email: "admin@example.com"
vault_sub2api_admin_password: "CHANGEME"

# Multica secrets
# postgres 密码 (openssl rand -hex 32, hex 字符避免 DATABASE_URL 转义问题)
vault_multica_postgres_password: "CHANGEME"
# JWT 签名密钥 (openssl rand -hex 32)
vault_multica_jwt_secret: "CHANGEME"
# 允许注册的邮箱白名单 (ALLOW_SIGNUP=false 时的例外名单, YAML list; 空列表 = 关闭所有新注册)
vault_multica_allowed_emails: []

# Multica GitHub App (slug 来自 App 公共 URL；App ID 为数字标识)
# 四项须全空或全部配置; slug 形如 https://github.com/apps/<slug> 的尾段
vault_multica_github_app_slug: "your-github-app-slug"
vault_multica_github_app_id: "123456"
# 与 GitHub App 表单中的 Webhook secret 一致，不是 OAuth Client secret
vault_multica_github_webhook_secret: "CHANGEME"
# 完整 PEM 私钥，包含 BEGIN/END 行与真实换行；用 YAML block scalar (|) 存入加密 Vault
vault_multica_github_app_private_key: |
  -----BEGIN RSA PRIVATE KEY-----
  MIIEpAIBAAKCAQEA... (替换为 App Private keys 下载的完整 PEM)
  -----END RSA PRIVATE KEY-----

# Traefik Dashboard 认证用户名
vault_traefik_dashboard_auth_user: "admin"

# Traefik Dashboard 认证密码 (htpasswd hash 值, 不包含用户名前缀)
# 生成: htpasswd -nbB admin 'YOUR_PASSWORD' | cut -d: -f2 | sed 's/\$/\$\$/g'
# 注意: 只需要密码 hash 部分，不要包含 "username:" 前缀
vault_traefik_dashboard_auth_password_hash: "CHANGEME"

# Beszel Agent (hub 位于 y9000p)
# KEY = hub 首次启动生成的公钥 (y9000p: /srv/docker/beszel/beszel_data/id_ed25519.pub)
vault_beszel_agent_key: "ssh-ed25519 CHANGEME"
# hub Settings -> Tokens 生成的通用令牌
vault_beszel_agent_token: "CHANGEME"

# WireGuard (VPS ↔ 家 iStoreOS)
# 生成: wg genkey / wg genpsk，公钥需在 iStoreOS uci 配置对应 peer
vault_wireguard_private_key: "CHANGEME"
vault_wireguard_preshared_key: "CHANGEME"
# 对端 endpoint (host:port)，含家庭域名，不进公开仓库
vault_wireguard_endpoint: "home.example.org:51820"
