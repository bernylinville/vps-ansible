name: VPS Ansible Deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows: [VPS Ansible CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: vps-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # PR CI 不部署；自动部署只消费本仓库 main push 的成功 CI。
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout the CI-validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Ansible and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Ansible Collections
        run: |
          ansible-galaxy install -r requirements.yml

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.ANSIBLE_SSH_KEY }}

      - name: Create Vault Password File
        env:
          VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          umask 077
          printf '%s\n' "$VAULT_PASSWORD" > .vault-password

      - name: Create Sudo Password File
        env:
          SUDO_PASSWORD: ${{ secrets.ANSIBLE_SUDO_PASSWORD }}
        run: |
          umask 077
          printf '%s\n' "$SUDO_PASSWORD" > .sudo-password

      - name: Run Ansible Playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'False'
          ANSIBLE_FORCE_COLOR: 'True'
        run: |
          ansible-playbook -i inventory/prod/hosts.yml playbooks/site.yml --diff
