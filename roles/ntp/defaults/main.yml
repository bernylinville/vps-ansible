---
# NTP role - Debian 13 only
# Uses ntpsec (default on Debian 13)

ntp_enabled: true
ntp_timezone: UTC
ntp_manage_config: true

ntp_area: ""
ntp_servers:
  - "time.cloudflare.com iburst"
  - "time.google.com iburst"
  - "0.us.pool.ntp.org iburst"
  - "1.us.pool.ntp.org iburst"

ntp_restrict:
  - "127.0.0.1"
  - "::1"
