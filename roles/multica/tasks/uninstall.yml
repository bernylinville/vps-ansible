---
- name: Check installed multica compose file
  ansible.builtin.stat:
    path: "{{ multica_compose_path }}"
  register: multica_uninstall_compose

- name: Remove multica containers and its dedicated network without deleting data
  community.docker.docker_compose_v2:
    project_src: "{{ multica_stack_dir }}"
    files: ["{{ multica_compose_path }}"]
    state: absent
    remove_orphans: true
    remove_volumes: false
  when: multica_uninstall_compose.stat.exists
  no_log: true

- name: Explain retained multica data
  ansible.builtin.debug:
    msg: "卸载不删除 {{ multica_stack_dir }} 下的配置和数据；site.yml 不再部署 Multica。"
