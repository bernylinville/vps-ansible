---
- name: Create Vaultwarden stack directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "{{ '0700' if item == vaultwarden_stack_dir or item == vaultwarden_data_dir else '0755' }}"
  loop:
    - "{{ vaultwarden_stack_dir }}"
    - "{{ vaultwarden_data_dir }}"

- name: Render Vaultwarden environment file
  ansible.builtin.template:
    src: .env.j2
    dest: "{{ vaultwarden_env_path }}"
    mode: "0600"

- name: Render Vaultwarden compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ vaultwarden_compose_path }}"
    mode: "0644"

- name: Start Vaultwarden stack
  community.docker.docker_compose_v2:
    project_src: "{{ vaultwarden_stack_dir }}"
    files:
      - "{{ vaultwarden_compose_path }}"
    state: present
    pull: "{{ vaultwarden_image_pull_policy | default('always', true) }}"
