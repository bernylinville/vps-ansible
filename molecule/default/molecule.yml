---
driver:
  name: docker
platforms:
  - name: vps-test
    image: "geerlingguy/docker-debian13-ansible:latest"
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    published_ports:
      - "18080:80"
      - "18443:443"
    groups:
      - vps
provisioner:
  name: ansible
  config_options:
    defaults:
      roles_path: /home/kchou/Code/vps-ansible/roles
      vault_password_file: /home/kchou/Code/vps-ansible/.vault-password
      inventory: /home/kchou/Code/vps-ansible/inventory/prod/hosts.yml
  inventory:
    host_vars:
      vps-test:
        vault_vps_host_ip: "127.0.0.1"
        vault_domain_name: "localhost"
        vault_ssh_port: "22"
        vault_ansible_user: "root"
        vault_ansible_become_password: ""
        ansible_user: "root"
        ansible_port: "22"
        domain_name: "localhost"
        vault_traefik_cloudflare_dns_api_token: "test-token"
        vault_traefik_dashboard_auth_password_hash: "$$2b$$04$$q0aZye//9OQ3DUBBZD/speSW6YZCQMbTIopUnG3DmUPGDJ2wjTUH2"
        vault_vaultwarden_admin_token: "test-token"
        traefik_cloudflare_dns_api_token: "test-token"
        traefik_image: traefik
        traefik_image_tag: v3.7.13
        traefik_container_name: traefik
        traefik_acme_email: ""
        traefik_acme_ca_server: https://acme-v02.api.letsencrypt.org/directory
        traefik_dns_challenge_provider: cloudflare
        traefik_log_level: INFO
        traefik_metrics_enabled: true
        vaultwarden_image: vaultwarden/server
        vaultwarden_image_tag: "1.37.2"
        vaultwarden_container_name: vaultwarden
        vaultwarden_signups_allowed: false
        timezone: UTC
        traefik_enabled: true
        vaultwarden_enabled: true
        traefik_image_pull_policy: never
        vaultwarden_image_pull_policy: never
        vault_sub2api_postgres_password: "molecule-pg-pass-0123456789abcdef"
        vault_sub2api_redis_password: "molecule-redis-pass-0123456789abcdef"
        vault_sub2api_jwt_secret: "molecule-jwt-secret-0123456789abcdef"
        vault_sub2api_totp_encryption_key: "molecule-totp-key-00123456789abcdef"
        docker_custom_network_name: proxy_net
        docker_custom_network_subnet: "10.203.57.0/24"
        docker_custom_network_gateway: "10.203.57.1"
  playbooks:
    converge: converge.yml
    verify: verify.yml
verifier:
  name: ansible

scenario:
  # 依赖由 mise run deps 统一安装, 此处跳过 dependency 阶段
  test_sequence:
    - destroy
    - syntax
    - create
    - converge
    - idempotence
    - verify
    - destroy
