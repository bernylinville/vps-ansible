---
driver:
  name: default
platforms:
  - name: localhost
provisioner:
  name: ansible
  env:
    # 独立场景不依赖本机或 CI 的生产 Vault/sudo 密码文件。
    ANSIBLE_VAULT_PASSWORD_FILE: "${MOLECULE_SCENARIO_DIRECTORY}/test-password.txt"
    ANSIBLE_BECOME_PASSWORD_FILE: "${MOLECULE_SCENARIO_DIRECTORY}/test-password.txt"
  config_options:
    defaults:
      roles_path: "${MOLECULE_PROJECT_DIRECTORY}/roles"
  inventory:
    host_vars:
      localhost:
        ansible_connection: local
        ansible_become: false
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
        cumora_stack_dir: /tmp/vps-ansible-cumora-molecule
        cumora_project_name: cumora-molecule
        cumora_server_container_name: cumora-molecule-server
        cumora_postgres_container_name: cumora-molecule-postgres
        cumora_redis_container_name: cumora-molecule-redis
        docker_custom_network_name: cumora_molecule_proxy
        cumora_internal_network_name: cumora_molecule_internal
        domain_name: example.test
        timezone: UTC
        vault_cumora_postgres_password: "0123456789abcdef0123456789abcdef"
        vault_cumora_agent_runtime_secret: "molecule-runtime-secret-0123456789abcdef"
        vault_cumora_openai_api_key: "molecule-key-with-$$-and-quotes-\"-no-provider-calls"
        vault_cumora_github_client_id: molecule-client-id
        vault_cumora_github_client_secret: molecule-client-secret
        vault_cumora_admin_emails: [admin@example.test]
        traefik_websecure_forwarded_trusted_ips: [10.247.98.3/32]
        cumora_waitlist_enabled: true
  playbooks:
    create: create.yml
    converge: converge.yml
    verify: verify.yml
    destroy: destroy.yml
verifier:
  name: ansible
scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - check
    - converge
    - idempotence
    - verify
    - destroy
